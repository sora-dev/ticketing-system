version: '3.9'

services:
  mongo:
    image: mongo:6
    container_name: rbi-itrack-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: rbi-itrack-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - MONGODB_URI=mongodb://mongo:27017/ticketing-system
      - HOST=0.0.0.0
      - PORT=5001
      - NODE_ENV=production
    depends_on:
      - mongo
    ports:
      - "5001:5001"
    volumes:
      - backend_uploads:/app/uploads
      - backend_backups:/app/backups

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=http://itrack.rbi.local
    container_name: rbi-itrack-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      - REACT_APP_API_URL=http://itrack.rbi.local
      - NODE_ENV=production
    depends_on:
      - backend
    ports:
      - "80:3000"

volumes:
  mongo_data:
  backend_uploads:
  backend_backups: